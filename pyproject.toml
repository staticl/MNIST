[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-cnn-mnist"
version = "0.1.0"
description = "A convolutional neural network for MNIST built from scratch in NumPy."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Louis Bösenberg" }]
keywords = ["numpy", "cnn", "mnist", "deep-learning", "from-scratch"]
dependencies = [
    "numpy",
    "matplotlib",
    "Pillow",
    "kagglehub",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]